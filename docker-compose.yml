services:

  db:
    image: mysql:8.0
    container_name: smarttask-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: smarttask
      MYSQL_USER: smartuser
      MYSQL_PASSWORD: smartpassword
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - smarttask-network

  backend:
    image: smarttask-backend:1.0
    container_name: smarttask-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      - db
    networks:
      - smarttask-network

  frontend:
    image: smarttask-frontend:1.0
    container_name: smarttask-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - smarttask-network

volumes:
  mysql_data:

networks:
  smarttask-network:
    driver: bridge
