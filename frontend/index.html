<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartTask - Gestion des tâches</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
            min-height: 100vh;
        }

        /* NAVBAR */
        .navbar {
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            color: #2563eb;
        }

        .nav-title {
            color: #6b7280;
            font-size: 14px;
        }

        /* CONTAINER */
        .container {
            width: 86%;
            max-width: 1100px;
            margin: 40px auto;
        }

        .welcome {
            margin-bottom: 30px;
        }

        .welcome h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .welcome p {
            color: #6b7280;
        }

        /* STATISTICS */
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 14px;
            padding: 22px;
            border: 1px solid #e5e7eb;
        }

        .stat-card span {
            color: #6b7280;
            font-size: 14px;
        }

        .stat-card h2 {
            font-size: 30px;
            margin-top: 8px;
        }

        /* MAIN CARD */
        .task-card {
            background: white;
            border-radius: 16px;
            border: 1px solid #e5e7eb;
            padding: 28px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.04);
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
        }

        .task-header h2 {
            font-size: 22px;
        }

        /* ADD TASK */
        .add-task {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .add-task input {
            flex: 1;
            padding: 14px 16px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        .add-task input:focus {
            border-color: #2563eb;
        }

        .add-task button {
            border: none;
            background: #2563eb;
            color: white;
            padding: 0 22px;
            border-radius: 9px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .add-task button:hover {
            background: #1d4ed8;
        }

        /* TASK LIST */
        #taskList {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .task {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 16px;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            background: #fafafa;
        }

        .task-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .task-left input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .task-title {
            font-size: 15px;
        }

        .task.completed .task-title {
            text-decoration: line-through;
            color: #9ca3af;
        }

        .delete-btn {
            border: none;
            background: #fee2e2;
            color: #dc2626;
            padding: 8px 11px;
            border-radius: 7px;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: #fecaca;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #9ca3af;
        }

        /* FOOTER */
        footer {
            text-align: center;
            margin: 35px 0;
            color: #9ca3af;
            font-size: 13px;
        }

        /* RESPONSIVE */
        @media (max-width: 700px) {
            .stats {
                grid-template-columns: 1fr;
            }

            .add-task {
                flex-direction: column;
            }

            .add-task button {
                padding: 13px;
            }

            .task-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="logo">SmartTask</div>
        <div class="nav-title">Gestion intelligente des tâches</div>
    </nav>

    <main class="container">

        <section class="welcome">
            <h1>Bonjour 👋</h1>
            <p>Organisez vos tâches simplement et efficacement.</p>
        </section>

        <section class="stats">

            <div class="stat-card">
                <span>Total des tâches</span>
                <h2 id="totalTasks">0</h2>
            </div>

            <div class="stat-card">
                <span>Tâches terminées</span>
                <h2 id="completedTasks">0</h2>
            </div>

            <div class="stat-card">
                <span>Tâches en cours</span>
                <h2 id="pendingTasks">0</h2>
            </div>

        </section>

        <section class="task-card">

            <div class="task-header">
                <h2>Mes tâches</h2>
            </div>

            <div class="add-task">
                <input
                    type="text"
                    id="taskInput"
                    placeholder="Ajouter une nouvelle tâche..."
                >

                <button onclick="addTask()">
                    + Ajouter
                </button>
            </div>

            <div id="taskList"></div>

        </section>

        <footer>
            SmartTask — Application de gestion de tâches
        </footer>

    </main>

    <script>

        const API_URL = "http://localhost:5000/tasks";

        let tasks = [];

        async function loadTasks() {

            try {

                const response = await fetch(API_URL);

                tasks = await response.json();

                displayTasks();

            } catch (error) {

                console.error("Erreur :", error);

            }

        }


        function displayTasks() {

            const taskList = document.getElementById("taskList");

            taskList.innerHTML = "";

            if (tasks.length === 0) {

                taskList.innerHTML =
                    '<div class="empty">Aucune tâche pour le moment.</div>';

            }

            tasks.forEach(task => {

                const div = document.createElement("div");

                div.className = "task";

                div.innerHTML = `
                    <div class="task-left">

                        <input
                            type="checkbox"
                            onchange="toggleTask(${task.id})"
                            ${task.completed ? "checked" : ""}
                        >

                        <span class="task-title">
                            ${task.title}
                        </span>

                    </div>

                    <button
                        class="delete-btn"
                        onclick="deleteTask(${task.id})"
                    >
                        🗑️
                    </button>
                `;

                if (task.completed) {
                    div.classList.add("completed");
                }

                taskList.appendChild(div);

            });

            updateStatistics();

        }


        function updateStatistics() {

            const total = tasks.length;

            const completed =
                tasks.filter(task => task.completed).length;

            const pending = total - completed;

            document.getElementById("totalTasks").textContent = total;

            document.getElementById("completedTasks").textContent = completed;

            document.getElementById("pendingTasks").textContent = pending;

        }


        async function addTask() {

            const input = document.getElementById("taskInput");

            const title = input.value.trim();

            if (!title) {

                alert("Veuillez saisir une tâche.");

                return;
            }

            try {

                const response = await fetch(API_URL, {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        title: title
                    })

                });

                if (!response.ok) {

                    throw new Error("Erreur lors de l'ajout.");

                }

                input.value = "";

                await loadTasks();

            } catch (error) {

                console.error(error);

                alert("Impossible d'ajouter la tâche.");

            }

        }


        async function deleteTask(id) {

            try {

                const response = await fetch(
                    `${API_URL}/${id}`,
                    {
                        method: "DELETE"
                    }
                );

                if (!response.ok) {

                    throw new Error("Erreur lors de la suppression.");

                }

                await loadTasks();

            } catch (error) {

                console.error(error);

                alert("Impossible de supprimer la tâche.");

            }

        }


        async function toggleTask(id) {

            const task = tasks.find(t => t.id === id);

            if (!task) return;

            task.completed = !task.completed;

            displayTasks();

        }


        document
            .getElementById("taskInput")
            .addEventListener("keypress", function(event) {

                if (event.key === "Enter") {

                    addTask();

                }

            });


        loadTasks();

    </script>

</body>
</html>
